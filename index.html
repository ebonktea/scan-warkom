<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <!-- Memuat Library QR Scanner via CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #reader { width: 300px; margin: 0 auto; background: #f0f0f0; border-radius: 8px; overflow: hidden; }
        #result { font-weight: bold; color: green; }
    </style>
</head>
<body>

    <h2>Scan QR Code</h2>
    <!-- Wadah untuk video live kamera -->
    <div id="reader"></div>
    <p>Hasil Scan: <span id="result">Menunggu QR Code...</span></p>

    <script>
        // 1. Inisialisasi objek pembaca QR dasar (tanpa UI bawaan)
        const html5QrCode = new Html5Qrcode("reader");

        // 2. Konfigurasi frame dan kecepatan scan
        const config = { 
            fps: 10, 
            qrbox: { width: 200, height: 200 } 
        };

        // 3. Fungsi sukses saat QR Code terbaca
        function onScanSuccess(decodedText, decodedResult) {
                document.getElementById('result').textContent = "Mengalihkan ke: " + decodedText;
                
                // Matikan kamera terlebih dahulu agar resource HP terlepas
                html5QrCode.stop().then(() => {
                    let targetUrl = decodedText.trim();

                    // Deteksi otomatis jika hasil scan belum diawali http:// atau https://
                    if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
                        targetUrl = "http://" + targetUrl;
                    }

                    // LANGSUNG KUNJUNGI LINK VOUCHER MIKROTIK
                    window.location.href = targetUrl;
                }).catch((err) => {
                    console.error("Gagal menghentikan kamera:", err);
                    window.location.href = decodedText.trim();
                });
        }

        // 4. Perintah untuk langsung menyalakan kamera otomatis saat halaman terbuka
        // Menggunakan opsi { facingMode: "environment" } untuk memaksa kamera belakang HP aktif
        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        ).catch((err) => {
            // Error handling jika izin kamera ditolak atau hardware tidak ditemukan
            document.getElementById('result').textContent = "Gagal membuka kamera otomatis: " + err;
            document.getElementById('result').style.color = "red";
        });
    </script>
</body>
</html>
