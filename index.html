<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner Hotspot</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f4f4f9; }
        #reader-container {
            width: 320px;
            height: 320px;
            margin: 0 auto;
            background: #222222;
            border: 4px solid #1a73e8;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            display: none;
        }
        #result { font-weight: bold; color: #1a73e8; margin-top: 20px; display: block; font-size: 16px; }
    </style>
</head>
<body>

    <h2>Scan QR Code Voucher</h2>
    <p style="color: #666; margin-bottom: 25px;">Posisikan QR Code tepat di dalam kotak</p>
    
    <div id="reader-container">
        <!-- Elemen video kamera ditempatkan di sini -->
        <video id="webcam-video" playsinline></video>
    </div>
    
    <canvas id="hidden-canvas"></canvas>
    <span id="result">Menghubungkan ke kamera...</span>

    <!-- PUSTAKA DECODER QR MANDIRI (jsQR Ringan - Di-minify Maksimal) -->

        // Pustaka QR Decoder Fallback jika sistem browser mengalami kegagalan engine dasar

    <!-- PROGRAM UTAMA APLIKASI WEB SCANNER -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById("webcam-video");
            const canvas = document.getElementById("hidden-canvas");
            const context = canvas.getContext("2d", { willReadFrequently: true });
            const resultText = document.getElementById("result");
            let localStream = null;
            let activeScanning = true;

            // Meminta akses penuh ke kamera belakang perangkat
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then((stream) => {
                    localStream = stream;
                    video.srcObject = stream;
                    video.setAttribute("playsinline", true); // Mencegah iOS membuka fullscreen player
                    video.play();
                    resultText.textContent = "Kamera aktif! Tempatkan QR Code pada kotak.";
                    
                    // Memulai siklus penangkapan frame video
                    requestAnimationFrame(prosesScanFrame);
                })
                .catch((error) => {
                    document.getElementById("reader-container").style.background = "#dd3333";
                    resultText.innerHTML = `
                        <span style="color:red; font-weight:bold;">Kamera Tidak Dapat Diakses!</span><br>
                        <small style="color:#333;">Eror: ${error.name}</small><br>
                        <small style="color:#666;">Solusi: Gunakan jalur tautan resmi <b>HTTPS://</b> dan ketuk tombol 'Izinkan'.</small>
                    `;
                });

            function prosesScanFrame() {
                if (!activeScanning) return;

                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    // Menyesuaikan ukuran kanvas tersembunyi dengan resolusi kamera HP
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // Menggambar frame video saat ini ke dalam kanvas untuk diekstraksi
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Mengambil data piksel mentah gambar
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    
                    // Memproses ekstraksi QR secara lokal menggunakan mesin jsQR internal
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code && code.data.trim() !== "") {
                        activeScanning = false; // Hentikan siklus pemindaian agar tidak terjadi pengulangan loop
                        const hasilTeks = code.data.trim();
                        resultText.textContent = "Mengalihkan...";

                        // Mematikan lampu lensa dan sensor hardware kamera HP
                        if (localStream) {
                            localStream.getTracks().forEach(track => track.stop());
                        }

                        // Mengolah teks hasil scan menjadi URL valid
                        let URLTujuan = hasilTeks;
                        if (!URLTujuan.startsWith("http://") && !URLTujuan.startsWith("https://")) {
                            URLTujuan = "http://" + URLTujuan;
                        }

                        // Eksekusi pengalihan langsung ke target voucher internet
                        window.location.href = URLTujuan;
                        return;
                    }
                }
                
                // Terus mengulang pemindaian pada frame video berikutnya
                requestAnimationFrame(prosesScanFrame);
            }
        });
    </script>
</body>
</html>
