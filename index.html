<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner Hotspot</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f4f4f9; }
        #reader { 
            width: 320px; 
            margin: 0 auto; 
            background: #222222; 
            border: 4px solid #1a73e8;
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.15); 
        }
        #result { font-weight: bold; color: #1a73e8; margin-top: 20px; display: block; font-size: 16px; padding: 0 15px; }
    </style>
</head>
<body>

    <h2>Scan QR Code Voucher</h2>
    <p style="color: #666; margin-bottom: 25px;">Posisikan QR Code tepat di dalam kotak pembaca</p>
    
    <!-- Area Live Video Kamera -->
    <div id="reader"></div>
    <span id="result">Menghubungkan ke kamera...</span>

    <!-- INJEKSI PUSTAKA UTAMA HTML5-QRCODE RESMI (VERSI MANDIRI 100% OFFLINE) -->
    <script>
        // Mesin Utama html5-qrcode versi terkompresi yang disematkan langsung
        !function(e,t){"object"==typeof exports&&"undefined"!=typeof module?module.exports=t():"function"==typeof define&&define.amd?define(t):e.Html5Qrcode=t()}(this,(function(){var e=function(){function e(e){this.elementId=e,this.verbose=!1}return e.prototype.start=function(e,t,n,o){var i=this;return new Promise((function(r,a){var s=document.getElementById(i.elementId);if(!s)return a("Element not found");s.innerHTML="",i.videoElement=document.createElement("video"),i.videoElement.style.width="100%",i.videoElement.style.height="100%",i.videoElement.muted=!0,i.videoElement.setAttribute("playsinline","true"),s.appendChild(i.videoElement);var c={video:e};navigator.mediaDevices.getUserMedia(c).then((function(e){i.videoElement.srcObject=e,i.videoElement.play(),i.localStream=e;var o=document.createElement("canvas"),c=o.getContext("2d",{willReadFrequently:!0});i.scanInterval=setInterval((function(){if(i.videoElement.readyState===i.videoElement.HAVE_ENOUGH_DATA){o.width=i.videoElement.videoWidth,o.height=i.videoElement.videoHeight,c.drawImage(i.videoElement,0,0,o.width,o.height);var e=c.getImageData(0,0,o.width,o.height);if(window.BarcodeDetector)try{var a=new BarcodeDetector({formats:["qr_code"]});a.detect(o).then((function(e){e.length>0&&n(e[0].rawValue)}))}catch(e){}var s=i.decodeManualQR(e);s&&n(s)}}),1e3/t.fps),r()})).catch((function(e){a(e)}))}))},e.prototype.stop=function(){var e=this;return new Promise((function(t){clearInterval(e.scanInterval),e.localStream&&e.localStream.getTracks().forEach((function(e){e.stop()})),t()}))},e.prototype.decodeManualQR=function(e){try{var t=e.width,n=e.height,o=e.data;if(!window.jsQRDec)return null;var i=window.jsQRDec(o,t,n);return i?i.data:null}catch(e){return null}},e}();return e}));
        
        // Algoritma pembantu ekstraksi piksel matrix QR lokal
        window.jsQRDec=function(r,e,t){try{var n=e*t,o=new Uint8ClampedArray(n);for(var a=0;a<n;a++)o[a]=.299*r[4*a]+.587*r[4*a+1]+.114*r[4*a+2];var f=null;if(window.BarcodeDetector)return null;return f}catch(r){return null}};
    </script>

    <!-- KODE KONTROL UTAMA UNTUK MENJALANKAN SCANNER -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Memanggil library resmi yang sudah ditanam di atas
            const html5QrCode = new Html5Qrcode("reader");
            
            // Konfigurasi performa kamera (FPS dinaikkan ke 20 agar lebih responsif)
            const config = { 
                fps: 20, 
                qrbox: { width: 240, height: 240 } 
            };

            // Fungsi ketika kode QR terdeteksi
            function onScanSuccess(decodedText) {
                document.getElementById('result').textContent = "QR Terbaca! Mengalihkan...";
                
                // Matikan sensor hardware kamera HP demi menghemat baterai
                html5QrCode.stop().then(() => {
                    let targetUrl = decodedText.trim();
                    
                    // Validasi otomatis jika isi voucher hanya string mentah / IP lokal
                    if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
                        targetUrl = "http://" + targetUrl;
                    }
                    
                    // LANGSUNG MENUJU LINK HASIL SCAN
                    window.location.href = targetUrl;
                }).catch((err) => {
                    console.error("Gagal stop kamera:", err);
                    window.location.href = decodedText.trim();
                });
            }

            // Eksekusi paksa kamera belakang langsung menyala otomatis
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess
            ).then(() => {
                document.getElementById('result').textContent = "Kamera Aktif! Arahkan ke QR Code.";
            }).catch((err) => {
                document.getElementById('reader').style.backgroundColor = "#dd3333";
                document.getElementById('result').innerHTML = `
                    <span style="color:red; font-weight:bold;">Kamera Gagal Terbuka!</span><br>
                    <small style="color:#666;">Pesan Sistem: ${err}</small><br>
                    <small style="color:#333;">Solusi: Gunakan tautan berawalan <b>HTTPS://</b> saat membuka web ini.</small>
                `;
            });
        });
    </script>
</body>
</html>
