    <script>
        // Memastikan skrip baru berjalan setelah halaman web sepenuhnya selesai dimuat
        document.addEventListener("DOMContentLoaded", () => {
            const html5QrCode = new Html5Qrcode("reader");
            const config = { 
                fps: 10, 
                qrbox: { width: 220, height: 220 } 
            };

            function onScanSuccess(decodedText, decodedResult) {
                document.getElementById('result').textContent = "Mengalihkan ke: " + decodedText;
                
                // Matikan kamera terlebih dahulu agar resource HP terlepas
                html5QrCode.stop().then(() => {
                    let targetUrl = decodedText.trim();

                    // Deteksi otomatis jika hasil scan belum diawali http:// atau https://
                    if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
                        targetUrl = "http://" + targetUrl;
                    }

                    // LANGSUNG KUNJUNGI LINK VOUCHER MIKROTIK
                    window.location.href = targetUrl;
                }).catch((err) => {
                    console.error("Gagal menghentikan kamera:", err);
                    window.location.href = decodedText.trim();
                });
            }

            // Jalankan kamera otomatis (Kamera Belakang)
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess
            ).then(() => {
                // Jika kamera berhasil menyala, ubah teks indikator
                document.getElementById('result').textContent = "Arahkan kamera ke QR Code Voucher";
            }).catch((err) => {
                // Menampilkan alasan detail di layar jika kamera gagal terbuka
                document.getElementById('result').innerHTML = `
                    <span style="color:red;">Gagal membuka kamera!</span><br>
                    <small style="color:#666; font-weight:normal;">Penyebab: ${err}</small>
                `;
                console.error("Error Kamera:", err);
            });
        });
    </script>
